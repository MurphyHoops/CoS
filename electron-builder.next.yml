# Local-only CoS Next preview packaging. Does not inherit the legacy
# extension, bridge or old app metadata. Not a signed production release.
appId: com.chatonsteroids.next
productName: Chat On Steroids Next
copyright: MIT licensed
extraMetadata:
  main: out-next/main/classic-main.js
  version: 4.0.0-alpha.0

directories:
  output: release-next
  buildResources: build

files:
  - out-next/**
  - package.json
  - '!extension/**'
  - '!out/**'
  - '!node_modules/node-pty/build/**/*'
  - '!node_modules/node-pty/third_party/**/*'
  - '!node_modules/node-pty/prebuilds/**/*'
  - '!node_modules/tree-sitter/prebuilds/**/*'
  - '!node_modules/tree-sitter-bash/prebuilds/**/*'

asarUnpack:
  - '**/node_modules/node-pty/**'
  - '**/node_modules/sharp/**'
  - '**/node_modules/@img/**'
  - '**/node_modules/tree-sitter/**'
  - '**/node_modules/tree-sitter-bash/**'

extraResources:
  - from: LICENSE
    to: LICENSE
  - from: THIRD-PARTY-NOTICES.txt
    to: THIRD-PARTY-NOTICES.txt
  - from: extension
    to: extension
    filter: ['**/*', '!**/*.map']

npmRebuild: false
compression: maximum
afterPack: scripts/afterpack-macos-adhoc-seal.mjs

win:
  target: nsis
  icon: build/icon.ico
  requestedExecutionLevel: asInvoker
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  shortcutName: Chat On Steroids Next
  uninstallDisplayName: Chat On Steroids Next
  deleteAppDataOnUninstall: false
  artifactName: CoS-Next-Windows-${arch}.${ext}

mac:
  target: [dmg, zip]
  # The complete v3 chat/Goal/Agent runtime requires native ARM64 bindings.
  # Shipping a renderer without these caused a no-window Next startup.
  files:
    # Copy native ARM64 modules from declared npm dependencies into the
    # same locations the original runtime resolves at startup.
    - from: node_modules/node-pty/prebuilds/darwin-${arch}
      to: node_modules/node-pty/prebuilds/darwin-${arch}
      filter: ['**/*']
    - from: node_modules/tree-sitter/prebuilds/darwin-${arch}
      to: node_modules/tree-sitter/prebuilds/darwin-${arch}
      filter: ['**/*']
    - from: node_modules/tree-sitter-bash/prebuilds/darwin-${arch}
      to: node_modules/tree-sitter-bash/prebuilds/darwin-${arch}
      filter: ['**/*']
  extraResources:
    # Stage from installed, version-matched CoS with:
    # node scripts/stage-next-classic-desktop.mjs
    - from: resources/packaging/desktop/darwin/${arch}
      to: desktop
      filter: ['macos-desktop-addon.node', 'libcos-desktop.dylib']
    - from: resources/packaging/tunnel/darwin/${arch}
      to: tunnel
      filter: ['**/*']
    - from: resources/packaging/rg/darwin/${arch}
      to: rg
      filter: ['**/*']
  category: public.app-category.developer-tools
  icon: build/icon.png
  identity: null
  notarize: false
  minimumSystemVersion: '13.0'
  artifactName: CoS-Next-macOS-${arch}.${ext}

linux:
  target: [AppImage, deb]
  category: Development
  executableName: chat-on-steroids-next
  artifactName: CoS-Next-Linux-${arch}.${ext}
  maintainer: Chat On Steroids Next <86187309+MurphyHoops@users.noreply.github.com>
